<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMEGA – Rejoindre le Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00E5FF;
            --indigo: #070810;
            --deep: #0D0F1A;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--indigo);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* ── BACKGROUND ── */
        .bg-glow {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at center, rgba(0, 229, 255, 0.05) 0%, transparent 70%);
        }

        .header { padding: 40px 60px; border-bottom: 1px solid var(--border); }
        .logo { display:flex; align-items:center; gap:10px; text-decoration:none; color:white; font-size:1.5rem; font-weight:800; }
        .logo img { width:32px; height:32px; }

        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(40px);
            padding: 50px;
            width: 100%;
            max-width: 500px;
            border-radius: 30px;
            border: 1px solid var(--border);
            animation: slide-up 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slide-up { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }

        .steps { font-size: 0.75rem; color: var(--cyan); font-weight: 800; letter-spacing: 2px; margin-bottom: 15px; }
        .title { font-size: 2.2rem; font-weight: 900; margin-bottom: 15px; line-height: 1.1; }
        .sub { color: rgba(255,255,255,0.5); margin-bottom: 30px; font-size: 0.95rem; }

        .form-group { margin-bottom: 18px; }
        .input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            outline: none;
            transition: 0.3s;
        }
        .input:focus { border-color: var(--cyan); background: rgba(0, 222, 255, 0.05); }

        .btn {
            width: 100%;
            padding: 18px;
            background: var(--cyan);
            color: var(--indigo);
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 10px 30px rgba(0, 229, 255, 0.2);
            transition: 0.3s;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 15px 40px rgba(0, 229, 255, 0.4); }

        .footer-link { margin-top: 25px; text-align: center; font-size: 0.9rem; color: rgba(255,255,255,0.3); }
        .footer-link a { color: var(--cyan); text-decoration: none; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <header class="header">
        <a href="index.html" class="logo">
            <img src="omega_hologram_icon_1775582871635.png" alt="Omega">
            <span>OMEGA</span>
        </a>
    </header>

    <div class="container">
        <div class="card">
            <p class="steps">ÉTAPE 01 / 03</p>
            <h1 class="title">Bienvenue dans l'adhésion d'élite.</h1>
            <p class="sub">Libérez toute la puissance du streaming HD sans publicité dès maintenant.</p>
            
            <form onsubmit="event.preventDefault(); window.location.href='home.html'">
                <div class="form-group">
                    <input type="email" class="input" placeholder="Adresse e-mail" required>
                </div>
                <div class="form-group">
                    <input type="password" class="input" placeholder="Choisir un mot de passe" required>
                </div>
                <button type="submit" class="btn">CONTINUER</button>
            </form>

            <div class="footer-link">
                Déjà membre ? <a href="login.html">S'identifier</a>
            </div>
        </div>
    </div>

</body>
</html>
