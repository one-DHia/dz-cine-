<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DZ CINE OMEGA – L'expérience ultime du streaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00E5FF;
            --indigo: #070810;
            --deep: #0D0F1A;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --gold: #C9A84C;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--indigo);
            color: var(--white);
            overflow-x: hidden;
        }

        /* ── BACKGROUND ANIMÉ ── */
        .bg-glow {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: 
                radial-gradient(circle at 80% 20%, rgba(0, 229, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(201, 168, 76, 0.03) 0%, transparent 50%);
        }

        .cyber-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            mask-image: radial-gradient(circle at center, black 0%, transparent 80%);
        }

        /* ── NAVBAR ── */
        .nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }

        .logo-img { width: 35px; height: 35px; border-radius: 8px; }
        .logo-text { font-size: 1.4rem; font-weight: 800; letter-spacing: 1px; }

        .btn-ghost {
            color: var(--cyan);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: 10px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            transition: 0.3s;
        }

        .btn-ghost:hover {
            background: rgba(0, 229, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
        }

        /* ── HERO ── */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 20px;
            position: relative;
        }

        .hero-card {
            background: var(--glass);
            backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 60px;
            max-width: 1000px;
            width: 100%;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
            animation: card-up 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes card-up {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .badge {
            background: rgba(0, 229, 255, 0.1);
            color: var(--cyan);
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 25px;
            border: 1px solid rgba(0, 229, 255, 0.3);
        }

        .title {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 900;
            margin-bottom: 25px;
            line-height: 1;
            background: linear-gradient(135deg, #fff 40%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .title span { color: var(--cyan); -webkit-text-fill-color: var(--cyan); }

        .sub {
            font-size: clamp(1.1rem, 2vw, 1.4rem);
            color: rgba(255,255,255,0.7);
            max-width: 600px;
            margin: 0 auto 40px;
            line-height: 1.6;
        }

        .hero-btns {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-main {
            background: var(--cyan);
            color: var(--indigo);
            padding: 18px 40px;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.1rem;
            box-shadow: 0 10px 30px rgba(0, 229, 255, 0.3);
            transition: 0.3s;
        }

        .btn-main:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 229, 255, 0.5);
        }

        /* ── INTERACTIVE WALL ── */
        .wall {
            padding: 80px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .wall-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            perspective: 1000px;
        }

        .wall-card {
            aspect-ratio: 2/3;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: 0.4s;
            cursor: pointer;
        }

        .wall-card:hover {
            transform: translateZ(50px) rotateY(10deg);
            border-color: var(--cyan);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .wall-card img { width: 100%; height: 100%; object-fit: cover; }

        /* ── FOOTER ── */
        .footer {
            padding: 60px 20px;
            text-align: center;
            border-top: 1px solid var(--border);
            color: rgba(255,255,255,0.4);
        }

        .footer p { margin-bottom: 20px; }
        .footer-logo { font-weight: 900; color: white; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="cyber-grid"></div>

    <nav class="nav">
        <a href="#" class="nav-logo">
            <img src="omega_hologram_icon_1775582871635.png" class="logo-img">
            <span class="logo-text">OMEGA</span>
        </a>
        <a href="login.html" class="btn-ghost">ACCÈS MEMBRE</a>
    </nav>

    <main class="hero">
        <div class="hero-card">
            <div class="badge">V3.0 PRE-RELEASE</div>
            <h1 class="title">LE CINÉMA <span>REBORN.</span></h1>
            <p class="sub">Vivez l'expérience de streaming la plus avancée. Zéro publicité, haute fidélité, et totalement gratuit pour la communauté.</p>
            
            <div class="hero-btns">
                <a href="signup.html" class="btn-main">REJOINDRE LE CLUB</a>
            </div>
        </div>
    </main>

    <section class="wall">
        <div class="wall-grid" id="wall-grid">
            <!-- Dynamically populated by JS for demo -->
        </div>
    </section>

    <footer class="footer">
        <span class="footer-logo">DZ CINE OMEGA</span>
        <p>&copy; 2026 DZ CINE OMEGA. Tous droits réservés.</p>
        <div style="font-size: 0.8rem;">
            Propulsé par le réseau OMEGA 💎
        </div>
    </footer>

    <script>
        // Simple parallax effect
        document.addEventListener('mousemove', e => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            document.querySelector('.hero-card').style.transform = `translate(${moveX}px, ${moveY}px)`;
        });

        // Populate wall with demo posters
        const posters = [
            '/1E5baAaEse26fej7uHcjOgEE2t2.jpg',
            '/8b8R8l88Qje9dn9OE8PY05Nxl1X.jpg',
            '/qNBAXBIQlnOThrVvA6mA2B5ggkl.jpg',
            '/yDHYTfA3R0jFYba16jBB1ef8oIt.jpg',
            '/qJ2tW6WMUDux911r6m7haRef0WH.jpg',
            '/kXfKGfaEc6UopmFsGbdNrawgQTi.jpg',
            '/4g5gK5eGWZg8swIZl6eX2AoJp8S.jpg'
        ];
        
        const grid = document.getElementById('wall-grid');
        posters.forEach(p => {
            const card = document.createElement('div');
            card.className = 'wall-card';
            card.innerHTML = `<img src="https://image.tmdb.org/t/p/w300${p}">`;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
