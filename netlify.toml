[build]
  publish = "."
  functions = "netlify/functions"

# Rediriger les appels API vers les fonctions serverless
[[redirects]]
  from = "/api/data"
  to = "/.netlify/functions/data"
  status = 200

[[redirects]]
  from = "/api/details"
  to = "/.netlify/functions/details"
  status = 200

[[redirects]]
  from = "/api/sources"
  to = "/.netlify/functions/sources"
  status = 200

# La racine pointe vers la landing page
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Pages d'authentification
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/signup.html"
  status = 200

# Le catalogue principal
[[redirects]]
  from = "/home"
  to = "/home.html"
  status = 200
